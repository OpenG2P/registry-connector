{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-connector.fullname" . }}-ui
  labels:
    {{- include "registry-connector.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "registry-connector.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}
